<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- mesmo gradiente da marca (135deg, #22d3ee ate #7c5cff) -->
  <defs>
    <linearGradient id="mh" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee" />
      <stop offset="1" stop-color="#7c5cff" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="18" fill="url(#mh)" />
  <!-- mesmo glifo do BrandLogo (painel de gestão), porém preenchido: em 16px o
       traço de 2.1 do original some -->
  <g transform="translate(14 14) scale(1.5)" fill="#fff">
    <rect x="3" y="3" width="7" height="9" rx="1.4" />
    <rect x="14" y="3" width="7" height="5" rx="1.4" />
    <rect x="14" y="12" width="7" height="9" rx="1.4" />
    <rect x="3" y="16" width="7" height="5" rx="1.4" />
  </g>
</svg>
